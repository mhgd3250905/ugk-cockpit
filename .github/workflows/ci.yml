name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    # The verified gate is Windows / Node 24 (docs record every acceptance on
    # this combination); add other platforms only after the suite is validated
    # on them.
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The runner image points TEMP at the 8.3 short name (C:\Users\RUNNER~1\...).
      # The service realpaths every user-visible path to the long form, and the
      # fixtures compare against raw os.tmpdir(), so the suite recorded for
      # acceptance -- where TEMP is already the long path -- fails on path
      # equality. Normalize once, for the runner image only; product code is
      # unchanged.
      - name: Normalize the runner temp path to its long form
        run: |
          $long = (Get-Item $env:TEMP).FullName
          "TEMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: npm ci
      # Temporary diagnostic: reproduces the space-creation primitive (worktree
      # add followed by probeGitWorktree) on the runner and prints the git facts
      # that the remaining five suite failures depend on. Remove once green.
      - name: Diagnose git environment
        run: |
          git --version
          git config --list --show-scope --show-origin
          node --input-type=module -e "
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import os from 'node:os';
          import path from 'node:path';
          import { probeGitWorktree } from './src/git/probe.mjs';
          const g = (cwd, args) => execFileSync('git', args, { cwd, encoding: 'utf8' });
          const root = mkdtempSync(path.join(os.tmpdir(), 'ci-diag-'));
          try {
            console.log('os.tmpdir():', os.tmpdir());
            const main = path.join(root, 'main');
            const space = path.join(root, 'space');
            g(root, ['init', '-b', 'main', main]);
            g(main, ['config', 'user.name', 'diag']);
            g(main, ['config', 'user.email', 'diag@invalid']);
            writeFileSync(path.join(main, 'a.txt'), 'a\n');
            g(main, ['add', 'a.txt']);
            g(main, ['commit', '-m', 'a']);
            g(main, ['worktree', 'add', space, 'HEAD']);
            console.log('space:', space);
            try {
              const o = await probeGitWorktree(space);
              console.log('probe OK head:', o.after.head, 'branch:', o.after.branch, 'coherent:', o.coherence);
            } catch (error) {
              console.log('probe FAILED code:', error.code, 'message:', error.message);
            }
            const status = g(space, ['status', '--porcelain=v1', '-z', '--untracked-files=all']);
            console.log('status bytes:', Buffer.byteLength(status), 'entries:', status.split('\u0000').filter(Boolean).length);
          } finally {
            try { rmSync(root, { recursive: true, force: true, maxRetries: 5 }); } catch {}
          }
          "
      - name: Full test suite
        run: npm test
      - name: Phase 0 gate
        run: npm run test:phase0
      - name: Build web frontend
        run: npm run build:web
