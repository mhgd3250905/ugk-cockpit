name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    # The verified gate is Windows / Node 24 (docs record every acceptance on
    # this combination); add other platforms only after the suite is validated
    # on them.
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test
      - name: Phase 0 gate
        run: npm run test:phase0
      - name: Build web frontend
        run: npm run build:web
