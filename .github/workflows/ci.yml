name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick-build:
    # Fast feedback is not the full gate; both shards below must also pass.
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # One source of truth: engines requires >=24.15.0 <25 and .node-version
          # pins the accepted build. '24' silently drifts to whatever the runner
          # ships, so the gate can run a Node nobody validated.
          node-version-file: .node-version
      # The runner image points TEMP at the 8.3 short name (C:\Users\RUNNER~1\...).
      # The service realpaths every user-visible path to the long form, and the
      # fixtures compare against raw os.tmpdir(), so the suite recorded for
      # acceptance -- where TEMP is already the long path -- fails on path
      # equality. Normalize once, for the runner image only; product code is
      # unchanged.
      - name: Normalize the runner temp path to its long form
        run: |
          $long = (Get-Item $env:TEMP).FullName
          "TEMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: npm ci
      - name: Quick feedback
        run: npm run test:quick
      - name: Build web frontend
        run: npm run build:web

  test-windows:
    needs: quick-build
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # One source of truth: engines requires >=24.15.0 <25 and .node-version
          # pins the accepted build. '24' silently drifts to whatever the runner
          # ships, so the gate can run a Node nobody validated.
          node-version-file: .node-version
      # The runner image points TEMP at the 8.3 short name (C:\Users\RUNNER~1\...).
      # The service realpaths every user-visible path to the long form, and the
      # fixtures compare against raw os.tmpdir(), so the suite recorded for
      # acceptance -- where TEMP is already the long path -- fails on path
      # equality. Normalize once, for the runner image only; product code is
      # unchanged.
      - name: Normalize the runner temp path to its long form
        run: |
          $long = (Get-Item $env:TEMP).FullName
          "TEMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$long" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: npm ci
      # Each shard has its own runner, ports and workspace. Together they run
      # the full suite once, including Phase 0; no second Phase 0 run is needed.
      # TAP retains worker exit codes, signals and causes hidden by the spec reporter.
      - name: Full test suite shard ${{ matrix.shard }}
        run: npm test -- --test-shard=${{ matrix.shard }} --test-reporter=tap
